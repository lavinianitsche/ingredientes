    <div class="container">

        <div class="section">

            <div class="buscar">

            <div id="mensagemBusca"></div>

            <div class="crud">
                <label id="nome">nome do ingrediente:</label>
                <input type="text">
                <label id="indice">índice:</label>
                <input type="text">
                <button type="button" onclick="cadastrar">cadastrar</button>
                <button type="button" onclick="alterar">alterar</button>
                <button type="button" onclick="deletar">deletar</button>
            </div>
            
            <div id="mensagemCrud"></div>

        </div>

        <div class="listSection">
            <h1><strong>lista</strong></h1>
            <div id="listaIngredientes" class="listaIngrediente"></div>
        </div>

    </div>
