<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verificador de ingredientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1><strong>verificador de ingredientes</strong></h1>

        <div class="section">

            <div class="buscar">
                <label for="buscarIngrediente">nome do ingrediente:</label>
                <input type="text" id="buscarIngrediente" placeholder="digite o nome do ingrediente">
                <button type="button" onclick="verificarIngrediente()">verificar</button>
            </div>

            <div id="mensagemBusca"></div>

            <div class="crud">
                <label for="nomeIngrediente">nome do ingrediente:</label>
                <input type="text" id="nomeIngrediente" placeholder="digite o nome do ingrediente">
                <label for="indiceIngrediente">índice:</label>
                <input type="text" id="indiceIngrediente" placeholder="digite o índice do ingrediente">
                <button type="button" onclick="cadastrar()">cadastrar</button>
                <button type="button" onclick="alterar()">alterar</button>
                <button type="button" onclick="deletar()">deletar</button>
            </div>
            
            <div id="mensagemCrud"></div>

        </div>

        <div class="listSection">
            <h1><strong>lista</strong></h1>
            <div id="listaIngredientes" class="listaIngrediente"></div>
        </div>

    </div>


    <!-- não foi finalizado!!!! -->

</body>

<script src="js/script.js"></script>

</html>
